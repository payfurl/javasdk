# Compile and unit tests on every push to main and every pull request, on each Java the SDK supports. The release
# workflow runs it before it publishes. The tests never call an API: payfurl/platform runs the integration tests
# (`just e2e`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # `test`: the check main's branch protection requires. It passes only when every JDK below passed.
  test:
    runs-on: ubuntu-latest
    needs: jdk
    if: always()
    steps:
      - run: test "${{ needs.jdk.result }}" = success

  jdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify: compile (for Java 8's API), unit tests, and the source and javadoc jars a release attaches.
      - name: Build and unit tests
        run: mvn -B -ntp verify
