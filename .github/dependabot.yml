version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      # OkHttp 5 and JUnit 6 need newer Java or Kotlin than this 1.x line supports (Java 8).
      - dependency-name: com.squareup.okhttp3:*
        update-types: [version-update:semver-major]
      - dependency-name: org.junit.jupiter:*
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
